[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "substratebench"
version = "0.4.0"
description = "Reproducible four-bit and eight-bit task-memory reference benchmarks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
substratebench = "substratebench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
